[project]
name = "minicode"
version = "0.1.0"
description = "A learning project for building a small coding agent runtime."
requires-python = ">=3.9"
dependencies = [
    "openai",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
