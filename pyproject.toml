[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micode"
version = "0.1.0"
description = "A learning project for building a small coding agent runtime."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai",
    "tomli; python_version < '3.11'",
]

[project.scripts]
micode = "micode.cli:main"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
